<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ja' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">トップ</a>
        <a href="{{ '/#contests' | relative_url }}">コンテスト一覧</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>本サイトは個人がまとめた非公式の情報です。最新かつ正確な情報は各コンテストの公式サイトをご確認ください。</p>
      <p>&copy; {{ 'now' | date: '%Y' }} {{ site.title }}</p>
    </div>
  </footer>

  <script>
  (function () {
    const pad = (n, w) => String(n).padStart(w, '0');

    const badges = document.querySelectorAll('.status-badge');
    badges.forEach(el => {
      const start = new Date(el.dataset.start).getTime();
      const end = new Date(el.dataset.end).getTime();
      const now = Date.now();
      let label, cls;
      if (Number.isNaN(start) || Number.isNaN(end)) { label = '-'; cls = 'status-unknown'; }
      else if (now < start) { label = '受付前'; cls = 'status-upcoming'; }
      else if (now > end)   { label = '終了';   cls = 'status-ended'; }
      else                  { label = '受付中'; cls = 'status-active'; }
      el.textContent = label;
      el.classList.add(cls);
    });

    const els = document.querySelectorAll('.countdown');
    if (els.length === 0) return;
    function update() {
      const now = Date.now();
      let anyLive = false;
      els.forEach(el => {
        const deadline = new Date(el.dataset.deadline).getTime();
        if (Number.isNaN(deadline)) { el.textContent = '-'; return; }
        const diff = deadline - now;
        if (diff <= 0) {
          el.textContent = '受付終了';
          el.classList.add('countdown-expired');
          return;
        }
        anyLive = true;
        const totalSec = Math.floor(diff / 1000);
        const days = Math.floor(totalSec / 86400);
        const hours = Math.floor((totalSec % 86400) / 3600);
        const minutes = Math.floor((totalSec % 3600) / 60);
        const seconds = totalSec % 60;
        el.textContent = pad(days, 3) + '日' + pad(hours, 2) + '時間' + pad(minutes, 2) + '分' + pad(seconds, 2) + '秒';
      });
      if (anyLive) {
        window.requestAnimationFrame(() => setTimeout(update, 1000));
      }
    }
    update();
  })();
  </script>
</body>
</html>
